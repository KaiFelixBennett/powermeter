<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="820" viewBox="0 0 1300 820" role="img" aria-labelledby="t d">
  <title id="t">powermeter architecture</title>
  <desc id="d">Sources on several machines feed one measurement engine, which writes tidy CSV rows; widget, report, export and sync read them and apply efficiency and prices at query time.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f141c"/><stop offset="0.55" stop-color="#111722"/><stop offset="1" stop-color="#0d1119"/>
    </linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2534"/><stop offset="1" stop-color="#141b26"/>
    </linearGradient>
    <linearGradient id="csv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101823"/><stop offset="1" stop-color="#131d2a"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1b2431"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4b5a70"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b6cf0"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .h { font: 600 12px Inter, "Segoe UI", system-ui, sans-serif; letter-spacing: 2.2px; fill: #6b7d95; }
    .ttl { font: 600 19px Inter, "Segoe UI", system-ui, sans-serif; fill: #eef3fa; }
    .sub { font: 400 13px Inter, "Segoe UI", system-ui, sans-serif; fill: #93a3b8; }
    .lbl { font: 500 13px Inter, "Segoe UI", system-ui, sans-serif; fill: #c8d4e4; }
    .chip { font: 500 11.5px Inter, "Segoe UI", system-ui, sans-serif; }
    .mono { font: 400 12.5px ui-monospace, "SF Mono", Consolas, monospace; fill: #9fb2c9; }
    .monoHi { font: 600 12.5px ui-monospace, "SF Mono", Consolas, monospace; fill: #dce6f4; }
    .big { font: 600 34px Inter, "Segoe UI", system-ui, sans-serif; fill: #ffc45e; }
    .k { font: 600 13px Inter, "Segoe UI", system-ui, sans-serif; }
    .note { font: 400 12px Inter, "Segoe UI", system-ui, sans-serif; fill: #7f8fa6; }
  </style>

  <rect width="1300" height="820" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1298" height="818" rx="25" fill="url(#grid)" opacity="0.55"/>
  <rect x="1" y="1" width="1298" height="818" rx="25" fill="none" stroke="#223041"/>

  <!-- headline strip -->
  <text class="h" x="52" y="56">01 · MEASURE</text>
  <text class="h" x="470" y="56">02 · RECORD</text>
  <text class="h" x="884" y="56">03 · ANSWER</text>
  <line x1="52" y1="72" x2="404" y2="72" stroke="#22303f"/>
  <line x1="470" y1="72" x2="822" y2="72" stroke="#22303f"/>
  <line x1="884" y1="72" x2="1248" y2="72" stroke="#22303f"/>

  <!-- ============ 01 devices ============ -->
  <g filter="url(#soft)">
    <rect x="52" y="100" width="352" height="132" rx="16" fill="#151d28" stroke="#26313f"/>
  </g>
  <circle cx="78" cy="128" r="7" fill="#2dd4bf"/>
  <text class="ttl" x="96" y="133">Desktop PC</text>
  <text class="sub" x="96" y="154">Windows 11 · measured on the machine itself</text>
  <g class="chip">
    <rect x="72" y="172" width="86" height="24" rx="7" fill="#1d2a36" stroke="#2f4152"/><text x="83" y="188" fill="#9fe6da">WinPowerAPI</text>
    <rect x="166" y="172" width="72" height="24" rx="7" fill="#1d2a36" stroke="#2f4152"/><text x="177" y="188" fill="#9fe6da">NVML GPU</text>
    <rect x="246" y="172" width="66" height="24" rx="7" fill="#1d2a36" stroke="#2f4152"/><text x="257" y="188" fill="#9fe6da">battery</text>
    <rect x="320" y="172" width="66" height="24" rx="7" fill="#1d2a36" stroke="#2f4152"/><text x="331" y="188" fill="#9fe6da">rest</text>
  </g>
  <text class="note" x="72" y="220">efficiency 0.90 · own tariff optional</text>

  <g filter="url(#soft)">
    <rect x="52" y="252" width="352" height="132" rx="16" fill="#151d28" stroke="#26313f"/>
  </g>
  <circle cx="78" cy="280" r="7" fill="#38bdf8"/>
  <text class="ttl" x="96" y="285">Home server</text>
  <text class="sub" x="96" y="306">Linux · same repo, own host binding</text>
  <g class="chip">
    <rect x="72" y="324" width="76" height="24" rx="7" fill="#1a2836" stroke="#2c4054"/><text x="83" y="340" fill="#a8dcf7">RAPL pkg</text>
    <rect x="156" y="324" width="80" height="24" rx="7" fill="#1a2836" stroke="#2c4054"/><text x="167" y="340" fill="#a8dcf7">hwmon AMD</text>
    <rect x="244" y="324" width="72" height="24" rx="7" fill="#1a2836" stroke="#2c4054"/><text x="255" y="340" fill="#a8dcf7">file</text>
    <rect x="324" y="324" width="62" height="24" rx="7" fill="#1a2836" stroke="#2c4054"/><text x="335" y="340" fill="#a8dcf7">fixed</text>
  </g>
  <text class="note" x="72" y="372">devices.json binds a device to its host</text>

  <g filter="url(#soft)">
    <rect x="52" y="404" width="352" height="132" rx="16" fill="#151d28" stroke="#26313f"/>
  </g>
  <circle cx="78" cy="432" r="7" fill="#f472b6"/>
  <text class="ttl" x="96" y="437">Fridge socket</text>
  <text class="sub" x="96" y="458">Shelly / Tasmota smart plug over HTTP</text>
  <g class="chip">
    <rect x="72" y="476" width="122" height="24" rx="7" fill="#251c26" stroke="#3c2b3d"/><text x="83" y="492" fill="#f6b8d3">http + json key</text>
    <rect x="202" y="476" width="104" height="24" rx="7" fill="#251c26" stroke="#3c2b3d"/><text x="213" y="492" fill="#f6b8d3">max_age 120 s</text>
  </g>
  <text class="note" x="72" y="524">polls slower than the logging tick</text>

  <!-- ============ 02 engine + csv ============ -->
  <g filter="url(#soft)">
    <rect x="470" y="100" width="352" height="172" rx="16" fill="url(#engine)" stroke="#2b3a4c"/>
  </g>
  <text class="ttl" x="494" y="132">powermeter core</text>
  <text class="sub" x="494" y="153">one engine: widget, report, headless</text>
  <rect x="494" y="170" width="304" height="42" rx="10" fill="#0d131c" stroke="#233143"/>
  <text class="monoHi" x="510" y="196">core.step()  ·  every interval_seconds</text>
  <text class="note" x="494" y="236">retries discovery after 30 failed reads · keeps</text>
  <text class="note" x="494" y="254">last good value while a source is offline</text>

  <g filter="url(#soft)">
    <rect x="470" y="300" width="352" height="216" rx="16" fill="url(#csv)" stroke="#26374a"/>
  </g>
  <text class="ttl" x="494" y="332">2026-11.csv</text>
  <text class="sub" x="494" y="352">one row per source, per interval</text>
  <text class="mono" x="494" y="382">zeit,geraet,quelle,sekunden,watt</text>
  <text class="mono" x="494" y="404">2026-11-21 14:15,desktop,cpu,4.3,25.1</text>
  <text class="mono" x="494" y="426">2026-11-21 14:15,desktop,nvidia,4.3,52.0</text>
  <text class="mono" x="494" y="448">2026-11-21 14:15,fridge,http,4.3,114.0</text>
  <text class="mono" x="494" y="470">2026-11-21 14:16,server,rapl,4.3,38.7</text>
  <text class="note" x="494" y="496">plain text: greppable, diffable, no database</text>

  <g filter="url(#soft)">
    <rect x="470" y="544" width="352" height="98" rx="16" fill="#141c27" stroke="#24303e"/>
  </g>
  <text class="lbl" x="494" y="572">state.json — cache only</text>
  <text class="note" x="494" y="592">running totals + widget position + mute switches;</text>
  <text class="note" x="494" y="610">rebuilt from the CSVs whenever it is missing</text>

  <!-- ============ 03 answers ============ -->
  <g filter="url(#soft)">
    <rect x="884" y="100" width="364" height="112" rx="16" fill="#151d28" stroke="#2a3644"/>
  </g>
  <text class="ttl" x="908" y="130">Desktop widget</text>
  <rect x="908" y="144" width="316" height="46" rx="10" fill="#0c1118" stroke="#232f3d"/>
  <text class="big" x="924" y="176">333 W</text>
  <text class="lbl" x="1046" y="174">· CPU 151 W · GPU 150 W</text>

  <g filter="url(#soft)">
    <rect x="884" y="240" width="364" height="176" rx="16" fill="#151d28" stroke="#2a3644"/>
  </g>
  <text class="ttl" x="908" y="270">powermeter report</text>
  <line x1="908" y1="286" x2="1226" y2="286" stroke="#25313f"/>
  <text class="note" x="908" y="308">last 24 h · whole period</text>
  <text class="mono" x="1096" y="308" text-anchor="end">today</text>
  <text class="mono" x="1226" y="308" text-anchor="end">total</text>
  <text class="mono" x="908" y="332">avg power</text>
  <text class="mono" x="1096" y="332" text-anchor="end">43 W</text>
  <text class="monoHi" x="1226" y="332" text-anchor="end">36 W</text>
  <text class="mono" x="908" y="356">energy</text>
  <text class="mono" x="1096" y="356" text-anchor="end">0.69 kWh</text>
  <text class="monoHi" x="1226" y="356" text-anchor="end">12.45 kWh</text>
  <text class="mono" x="908" y="380">cost</text>
  <text class="mono" x="1096" y="380" text-anchor="end">0.21 €</text>
  <text class="monoHi" x="1226" y="380" text-anchor="end">3.72 €</text>
  <text class="mono" x="908" y="404">uptime</text>
  <text class="mono" x="1096" y="404" text-anchor="end">16.3 h</text>
  <text class="monoHi" x="1226" y="404" text-anchor="end">349.9 h</text>

  <g filter="url(#soft)">
    <rect x="884" y="444" width="364" height="198" rx="16" fill="#171528" stroke="#2f2b4a"/>
  </g>
  <circle cx="910" cy="472" r="7" fill="#a78bfa"/>
  <text class="ttl" x="928" y="477">One machine knows everything</text>
  <rect x="908" y="494" width="316" height="44" rx="10" fill="#100e1c" stroke="#2a2642"/>
  <text class="monoHi" x="924" y="520">powermeter sync   ·   ssh + export</text>
  <text class="note" x="908" y="550">ssh into each host and let it print its own export;</text>
  <text class="note" x="908" y="568">only newer rows, deduplicated by zeit + geraet + quelle.</text>
  <text class="note" x="908" y="590">offline option: powermeter merge &lt;folder&gt;</text>
  <text class="note" x="908" y="612">no daemon · no open port · no account</text>

  <!-- ============ flows ============ -->
  <g fill="none" stroke="#4b5a70" stroke-width="1.8">
    <path d="M404 166 H 436 V 318"/>
    <path d="M404 318 H 436"/>
    <path d="M404 470 H 436 V 318"/>
    <path d="M436 318 V 214"/>
    <path d="M436 214 H 470" marker-end="url(#ar)"/>
    <path d="M646 272 L 646 300" marker-end="url(#ar)"/>
    <path d="M646 516 L 646 544" marker-end="url(#ar)"/>
    <path d="M822 408 C 858 408 850 176 884 176" marker-end="url(#ar)"/>
    <path d="M822 372 C 856 372 852 330 884 330" marker-end="url(#ar)"/>
  </g>
  <circle cx="436" cy="318" r="3.5" fill="#4b5a70"/>
  <circle cx="822" cy="390" r="3.5" fill="#4b5a70"/>
  <path d="M884 544 C 856 544 862 470 822 470" fill="none" stroke="#8b6cf0" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#ar2)"/>

  <!-- ============ query-time strip ============ -->
  <g filter="url(#soft)">
    <rect x="52" y="700" width="820" height="86" rx="16" fill="#191521" stroke="#3a2f22"/>
  </g>
  <text class="k" x="76" y="726" fill="#ffc45e">applied when you look, never baked into history</text>
  <text class="monoHi" x="76" y="752">wall W = Σ component W ÷ η        cost = kWh × tariff_ct ÷ 100 + base fee</text>
  <text class="note" x="76" y="774">recalibrate the PSU or the tariff and old days follow, the raw measurement stays untouched</text>

  <g filter="url(#soft)">
    <rect x="892" y="700" width="356" height="86" rx="16" fill="#14201c" stroke="#25402f"/>
  </g>
  <text class="k" x="916" y="726" fill="#7ee2b0">tested, not assumed</text>
  <text class="note" x="916" y="748">22 unit tests · CI on Windows 3.9/3.12 and Ubuntu 3.12</text>
  <text class="note" x="916" y="768">standard library only · Python 3.9+ · MIT</text>
</svg>
