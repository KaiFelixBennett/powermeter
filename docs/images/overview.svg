<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img" aria-labelledby="t2 d2">
  <title id="t2">powermeter: three machines, one collector</title>
  <desc id="d2">A gaming PC, a Linux box and a NAS each keep their own measurement files; one collector pulls what is new over ssh and shows every device together.</desc>

  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101722"/><stop offset="0.5" stop-color="#121a26"/><stop offset="1" stop-color="#0d1420"/>
    </linearGradient>
    <linearGradient id="coll" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#1a2434"/><stop offset="1" stop-color="#131c29"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#1f6f66"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <linearGradient id="bar2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#1d5c7d"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="bar3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#57438f"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <pattern id="grid2" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1c2634"/></pattern>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b6cf0"/></marker>
    <filter id="sh2" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>

  <style>
    .h2 { font: 600 23px Inter, "Segoe UI", system-ui, sans-serif; fill: #f2f6fc; }
    .s2 { font: 400 13.5px Inter, "Segoe UI", system-ui, sans-serif; fill: #8fa1b8; }
    .nm { font: 600 18px Inter, "Segoe UI", system-ui, sans-serif; fill: #e9eff8; }
    .os { font: 400 12.5px Inter, "Segoe UI", system-ui, sans-serif; fill: #8296ad; }
    .fl { font: 500 11.5px ui-monospace, "SF Mono", Consolas, monospace; fill: #9fb2c9; }
    .lb { font: 500 12.5px Inter, "Segoe UI", system-ui, sans-serif; fill: #b8c6d8; }
    .ti { font: 600 17px Inter, "Segoe UI", system-ui, sans-serif; fill: #eef3fa; }
    .wg { font: 600 27px Inter, "Segoe UI", system-ui, sans-serif; fill: #ffc45e; }
    .pill { font: 600 12.5px Inter, "Segoe UI", system-ui, sans-serif; fill: #c3b2f7; letter-spacing: 0.4px; }
    .tiny { font: 400 11px Inter, "Segoe UI", system-ui, sans-serif; fill: #6e8098; }
    .axis { font: 400 11.5px ui-monospace, "SF Mono", Consolas, monospace; fill: #8496ac; }
  </style>

  <rect width="1240" height="620" rx="26" fill="url(#bg2)"/>
  <rect x="1" y="1" width="1238" height="618" rx="25" fill="url(#grid2)" opacity="0.6"/>
  <rect x="1" y="1" width="1238" height="618" rx="25" fill="none" stroke="#233145"/>

  <text class="h2" x="64" y="66">Every machine measures itself — one collector adds it up</text>
  <text class="s2" x="64" y="92">no server between them: the collector asks each host once, that host prints its own rows</text>

  <!-- machines -->
  <g filter="url(#sh2)"><rect x="64" y="120" width="252" height="104" rx="16" fill="#16202c" stroke="#2b3a4c"/></g>
  <g stroke="#2dd4bf" stroke-width="1.9" fill="none">
    <rect x="88" y="146" width="30" height="44" rx="5"/><path d="M95 157 h16 M95 165 h16"/><circle cx="103" cy="180" r="1.7" fill="#2dd4bf" stroke="none"/>
  </g>
  <text class="nm" x="134" y="164">Gaming PC</text>
  <text class="os" x="134" y="184">Windows 11 · CPU, GPU, battery</text>
  <rect x="88" y="234" width="152" height="26" rx="8" fill="#0e1521" stroke="#233145"/>
  <text class="fl" x="102" y="251">local 2026-11.csv</text>

  <g filter="url(#sh2)"><rect x="64" y="256" width="252" height="104" rx="16" fill="#16202c" stroke="#2b3a4c"/></g>
  <g stroke="#38bdf8" stroke-width="1.9" fill="none">
    <rect x="86" y="282" width="34" height="14" rx="4"/><rect x="86" y="300" width="34" height="14" rx="4"/><rect x="86" y="318" width="34" height="14" rx="4"/>
    <circle cx="113" cy="289" r="1.6" fill="#38bdf8" stroke="none"/><circle cx="113" cy="307" r="1.6" fill="#38bdf8" stroke="none"/><circle cx="113" cy="325" r="1.6" fill="#38bdf8" stroke="none"/>
  </g>
  <text class="nm" x="134" y="300">Linux box</text>
  <text class="os" x="134" y="320">Ubuntu · package power (RAPL)</text>
  <rect x="88" y="370" width="152" height="26" rx="8" fill="#0e1521" stroke="#233145"/>
  <text class="fl" x="102" y="387">local 2026-11.csv</text>

  <g filter="url(#sh2)"><rect x="64" y="392" width="252" height="104" rx="16" fill="#16202c" stroke="#2b3a4c"/></g>
  <g stroke="#a78bfa" stroke-width="1.9" fill="none">
    <rect x="86" y="418" width="34" height="44" rx="6"/><path d="M92 428 h22 M92 438 h22 M92 448 h22"/>
    <circle cx="91" cy="457" r="1.7" fill="#a78bfa" stroke="none"/>
  </g>
  <text class="nm" x="134" y="436">NAS in the cellar</text>
  <text class="os" x="134" y="456">Debian · smart plug per device</text>
  <rect x="88" y="506" width="152" height="26" rx="8" fill="#0e1521" stroke="#233145"/>
  <text class="fl" x="102" y="523">local 2026-11.csv</text>

  <!-- pull bus -->
  <g fill="none" stroke="#8b6cf0" stroke-width="1.9" stroke-dasharray="7 6">
    <path d="M240 247 C 470 247 430 292 566 292"/>
    <path d="M240 383 H 566"/>
    <path d="M240 519 C 470 519 430 412 566 412"/>
  </g>
  <line x1="566" y1="292" x2="566" y2="412" stroke="#8b6cf0" stroke-width="2.2"/>
  <circle cx="566" cy="349" r="4" fill="#8b6cf0"/>
  <path d="M566 349 H 604" fill="none" stroke="#8b6cf0" stroke-width="2.4" marker-end="url(#ar3)"/>
  <g filter="url(#sh2)"><rect x="392" y="188" width="212" height="54" rx="12" fill="#1a1730" stroke="#3a3361"/></g>
  <text class="pill" x="412" y="211">powermeter sync</text>
  <text class="axis" x="412" y="231">ssh · export · since marker</text>
  <path d="M500 242 C 500 268 540 268 560 288" fill="none" stroke="#5b4c8f" stroke-width="1.6" stroke-dasharray="3 5"/>

  <!-- collector -->
  <g filter="url(#sh2)"><rect x="604" y="176" width="572" height="346" rx="20" fill="url(#coll)" stroke="#33465e"/></g>
  <circle cx="636" cy="212" r="8" fill="#ffc45e"/>
  <text class="ti" x="654" y="218">One collector shows everything</text>
  <text class="s2" x="654" y="240">same files, same numbers, one screen</text>

  <rect x="636" y="262" width="286" height="60" rx="11" fill="#0c1118" stroke="#24303f"/>
  <text class="wg" x="654" y="302">333 W</text>
  <text class="lb" x="762" y="290">· Gaming PC 186 W</text>
  <text class="lb" x="762" y="310">· Linux 98 W · NAS 49 W</text>

  <rect x="944" y="262" width="200" height="128" rx="11" fill="#0e1420" stroke="#24303f"/>
  <text class="lb" x="962" y="288">kWh per device</text>
  <rect x="972" y="306" width="26" height="60" rx="4" fill="url(#bar1)"/>
  <rect x="1012" y="330" width="26" height="36" rx="4" fill="url(#bar2)"/>
  <rect x="1052" y="348" width="26" height="18" rx="4" fill="url(#bar3)"/>
  <line x1="962" y1="366" x2="1126" y2="366" stroke="#26323f"/>
  <text class="axis" x="972" y="382">pc</text>
  <text class="axis" x="1012" y="382">srv</text>
  <text class="axis" x="1052" y="382">nas</text>

  <rect x="636" y="338" width="286" height="150" rx="11" fill="#0c1118" stroke="#24303f"/>
  <text class="lb" x="654" y="364">powermeter report</text>
  <text class="axis" x="806" y="390" text-anchor="end">today</text>
  <text class="axis" x="900" y="390" text-anchor="end">total</text>
  <line x1="654" y1="398" x2="900" y2="398" stroke="#24303f"/>
  <text class="axis" x="654" y="420">energy</text>
  <text class="axis" x="806" y="420" text-anchor="end">0.69 kWh</text>
  <text class="axis" x="900" y="420" text-anchor="end">12.45 kWh</text>
  <text class="axis" x="654" y="444">cost</text>
  <text class="axis" x="806" y="444" text-anchor="end">0.21 €</text>
  <text class="axis" x="900" y="444" text-anchor="end">3.72 €</text>
  <text class="axis" x="654" y="468">uptime</text>
  <text class="axis" x="806" y="468" text-anchor="end">16.3 h</text>
  <text class="axis" x="900" y="468" text-anchor="end">349.9 h</text>
  <text class="tiny" x="636" y="510">efficiency and tariff per device, applied when the numbers are shown</text>

  <!-- footer pills -->
  <g>
    <rect x="64" y="556" width="136" height="30" rx="9" fill="#16202c" stroke="#2a3849"/><text class="tiny" x="80" y="575">no server needed</text>
    <rect x="208" y="556" width="158" height="30" rx="9" fill="#16202c" stroke="#2a3849"/><text class="tiny" x="224" y="575">no open incoming port</text>
    <rect x="374" y="556" width="150" height="30" rx="9" fill="#16202c" stroke="#2a3849"/><text class="tiny" x="390" y="575">offline option: merge</text>
    <rect x="532" y="556" width="168" height="30" rx="9" fill="#16202c" stroke="#2a3849"/><text class="tiny" x="548" y="575">import twice = no change</text>
    <rect x="708" y="556" width="176" height="30" rx="9" fill="#16202c" stroke="#2a3849"/><text class="tiny" x="724" y="575">ssh keys are the credential</text>
  </g>
</svg>
