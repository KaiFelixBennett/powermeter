[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "powermeter"
version = "1.0.0"
description = "Stromverbrauch und Kosten messen - Windows und Linux, auch fuer mehrere Geraete"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kai Felix Bennett" }]
keywords = ["stromverbrauch", "power", "energy", "rapl", "nvml", "shelly", "kwh"]
dependencies = []

[project.scripts]
powermeter = "powermeter.cli:main"

[tool.setuptools]
packages = ["powermeter", "powermeter.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
